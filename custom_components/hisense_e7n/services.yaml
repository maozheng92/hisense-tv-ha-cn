submit_code:
  name: Submit TV code
  description: >
    Send the 4 digits shown on the TV after this integration connects.
    爱家手机配对不显示这个码；只有电视授权新的局域网遥控时才会出现。
  target:
    entity:
      integration: hisense_e7n
      domain: remote
  fields:
    code:
      name: Code
      description: Digits shown on the TV.
      required: true
      example: "1234"
      selector:
        text:

send_key:
  name: Send remote key
  description: Send a 爱家 remoter KEY_* code over BLE (MQTT fallback).
  target:
    entity:
      integration: hisense_e7n
      domain: remote
  fields:
    key:
      name: Key
      description: Wire name (KEY_HOME) or alias (home, ok, mute).
      required: true
      example: KEY_HOME
      selector:
        text:

launch_app:
  name: Launch app
  description: >
    Open an app from 爱家 电视应用 → 我的应用. Android packages use LAN
    「电视打开」 (``/..pushsmartju``); store apps use MQTT ``launchapp``.
  target:
    entity:
      integration: hisense_e7n
      domain: media_player
  fields:
    name:
      name: App name
      required: true
      example: 云视听极光
      selector:
        text:
    url:
      name: App URL / package
      required: false
      example: com.ktcp.video
      selector:
        text:

refresh_apps:
  name: Refresh my apps
  description: Ask the TV for 电视应用 → 我的应用 (MQTT ``applist``).
  target:
    entity:
      integration: hisense_e7n
      domain: media_player
